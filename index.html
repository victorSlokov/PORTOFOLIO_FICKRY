<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Art Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>

    <nav class="p-6 flex justify-between items-center bg-white shadow-sm sticky top-0 z-50">
        <h1 class="text-2xl font-bold">Porto</h1>
        <div class="space-x-6 text-gray-600">
            <a href="#" class="hover:text-black">Home</a>
            <a href="#" class="hover:text-black">Projects</a>
            <a href="#" class="hover:text-black">Contact</a>
        </div>
    </nav>

    <section class="max-w-4xl mx-auto mt-12 p-6 flex flex-col md:flex-row items-center gap-8">
        <img src="img/profil.png" alt="Profile" class="w-48 h-48 rounded-lg object-cover shadow-lg">
        <div>
            <h2 class="text-3xl font-bold text-gray-800">Halo, Saya [Nama Kamu]</h2>
            <p class="mt-4 text-gray-600">Seorang Digital Artist yang fokus pada Coloring Art dan Illustration menggunakan Ibis Paint X.</p>
            <div class="flex gap-2 mt-4">
                <span class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-sm font-semibold">Digital Art</span>
                <span class="bg-purple-100 text-purple-600 px-3 py-1 rounded-full text-sm font-semibold">Ibis Paint X</span>
            </div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto my-16 p-6">
        <div class="flex justify-between items-end mb-8 border-b pb-4">
            <h3 class="text-2xl font-bold">My Works</h3>
            <p class="text-gray-500 italic text-sm">Coloring Art & Sketches</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="group relative overflow-hidden rounded-xl shadow-md bg-white border border-gray-200">
                <img src="img/kaiju.jpeg" alt="Art" class="w-full h-64 object-cover transition transform group-hover:scale-110">
                <div class="absolute inset-0 bg-black bg-opacity-40 opacity-0 group-hover:opacity-100 transition flex flex-col justify-center items-center text-white p-4">
                    <p class="font-bold">Ibis Paint X Art</p>
                    <button class="mt-2 text-xs bg-white text-black px-4 py-1 rounded-full">View Details</button>
                </div>
            </div>

            <div class="group relative overflow-hidden rounded-xl shadow-md bg-white border border-gray-200">
                <img src="img/MLBB.jpeg" alt="Art" class="w-full h-64 object-cover transition transform group-hover:scale-110">
                <div class="absolute inset-0 bg-black bg-opacity-40 opacity-0 group-hover:opacity-100 transition flex flex-col justify-center items-center text-white p-4">
                    <p class="font-bold">Coloring Project</p>
                    <button class="mt-2 text-xs bg-white text-black px-4 py-1 rounded-full">View Details</button>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-white border-t p-10 mt-20 text-center">
        <p class="text-gray-500">&copy; 2026 Porto Digital Art. Made with Passion.</p>
    </footer>

</body>
</html>
