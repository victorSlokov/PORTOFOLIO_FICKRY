<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Phone Mockup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #eeeeee;

            overflow: hidden;
        }


        /* ==================================================
           WRAPPER HP
           ================================================== */

        .phone-wrapper {
            position: absolute;

            /* POSISI HP */
            top: 50px;
            left: 100px;

            /* UKURAN HP */
            width: 320px;
            height: 650px;

            /*
                PORTRAIT:
                transform: rotate(0deg);

                LANDSCAPE:
                transform: rotate(90deg);
            */
            transform: rotate(0deg);
        }


        /* ==================================================
           BODY HP
           ================================================== */

        .phone {
            position: relative;

            width: 100%;
            height: 100%;

            background: #111;

            border: 8px solid #222;

            border-radius: 45px;

            padding: 8px;

            overflow: hidden;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.3);
        }


        /* ==================================================
           LAYAR HP
           ================================================== */

        .phone-screen {
            position: relative;

            width: 100%;
            height: 100%;

            background: #fff;

            border-radius: 32px;

            overflow: hidden;
        }


        /* ==================================================
           GAMBAR / ISI LAYAR
           ================================================== */

        .phone-screen img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        /* ==================================================
           NOTCH
           ================================================== */

        .notch {
            position: absolute;

            top: 0;
            left: 50%;

            transform: translateX(-50%);

            width: 110px;
            height: 28px;

            background: #111;

            border-radius: 0 0 18px 18px;

            z-index: 20;
        }


        /* Kamera notch */

        .notch::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            top: 9px;
            right: 15px;

            background: #333;

            border-radius: 50%;
        }


        /* ==================================================
           TOMBOL ITCH.IO
           ================================================== */

        .itch-button {
            position: absolute;

            /*
                POSISI TOMBOL

                Bisa kamu ubah:
                bottom: 35px;
                left: 50%;
            */

            bottom: 35px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 30;

            width: 180px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #fa5c5c;

            color: white;

            text-decoration: none;

            font-family: Arial, sans-serif;

            font-size: 16px;
            font-weight: bold;

            border-radius: 12px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }


        /* Hover tombol */

        .itch-button:hover {
            background: #e94b4b;

            transform:
                translateX(-50%)
                translateY(-3px);
        }


        /* ==================================================
           HOME INDICATOR
           ================================================== */

        .home-bar {
            position: absolute;

            bottom: 8px;
            left: 50%;

            transform: translateX(-50%);

            width: 90px;
            height: 4px;

            background: #222;

            border-radius: 10px;

            z-index: 30;
        }

    </style>
</head>


<body>


    <!-- ==================================================
         WRAPPER HP
         ================================================== -->

    <div class="phone-wrapper">


        <!-- BODY HP -->

        <div class="phone">


            <!-- LAYAR -->

            <div class="phone-screen">


                <!-- GAMBAR -->

                <img
                    src="gambar.jpg"
                    alt="Isi layar HP"
                >


                <!-- NOTCH -->

                <div class="notch"></div>


                <!-- BUTTON ITCH.IO -->

                <a
                    class="itch-button"
                    href="https://username.itch.io/nama-game"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    View on itch.io
                </a>


                <!-- HOME BAR -->

                <div class="home-bar"></div>


            </div>

        </div>

    </div>


</body>
</html>
